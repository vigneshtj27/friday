[project]
name = "friday"
version = "0.1.0"
description = "Self-hosted browser agent that operates real Chrome on your own accounts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pynacl>=1.5",
    "keyring>=25",
    "playwright>=1.48",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "pypdf>=6.21.0",
    "openpyxl>=3.1.5",
    "patchright>=1.64.1",
]


[project.scripts]
friday = "friday.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["chrome: launches real Google Chrome (run with -m chrome)"]
addopts = "-m 'not chrome' --timeout 60"
testpaths = ["tests"]
