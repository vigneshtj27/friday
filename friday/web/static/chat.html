<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>friday</title>
<style>
:root{
  --bg:#ffffff; --soft:#f6f6f7; --softer:#fafafa; --line:#ebebee; --line-strong:#dcdce1;
  --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
  --ink:#18181b; --ink-text:#ffffff;
  --accent:#2f5bea; --accent-soft:#eef2fe;
  --ok:#15803d; --ok-soft:#ecfdf3; --warn:#b45309; --warn-soft:#fff7eb; --bad:#b91c1c; --bad-soft:#fef2f2;
  --radius:16px; --shadow:0 1px 2px rgba(24,24,27,.04),0 4px 16px rgba(24,24,27,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:650;font-size:16px;letter-spacing:-.02em;flex:none}
.mark.sm{width:28px;height:28px;border-radius:9px;font-size:14px}
.who{display:flex;flex-direction:column;line-height:1.2;flex:1;min-width:0}
.who b{font-size:15px;font-weight:620;letter-spacing:-.01em}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.dot.off{background:#f59e0b}
.icon-btn{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px}
.icon-btn:hover{background:var(--soft);color:var(--text)}
.icon-btn.on{color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:180px;display:none}
.menu-list.open{display:block}
.menu-list button,.menu-list a{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer}
.menu-list button:hover,.menu-list a:hover{background:var(--soft);text-decoration:none}
.menu-list .danger{color:var(--bad)}

/* thread */
#scroller{flex:1;overflow-y:auto;overscroll-behavior:contain}
#thread{max-width:760px;margin:0 auto;padding:20px 16px 8px}
.older{display:flex;justify-content:center;margin:4px 0 16px}
.pill-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer}
.pill-btn:hover{color:var(--text);border-color:var(--line-strong)}
.day{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--faint);font-size:12px;font-weight:500;letter-spacing:.02em}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}

.msg{display:flex;gap:10px;margin:2px 0;animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.friday{align-items:flex-start}
.msg.friday .gutter{width:28px;flex:none}
.msg.friday.first{margin-top:14px}
.msg.owner{justify-content:flex-end}
.msg.owner.first{margin-top:14px}
.body{min-width:0;max-width:min(560px,86%)}
.msg.friday .body{max-width:min(600px,calc(100% - 38px))}
.text{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.friday .text{padding:2px 0}
.msg.owner .text{background:var(--ink);color:var(--ink-text);padding:9px 14px;border-radius:18px 18px 6px 18px}
.msg.owner:not(.last) .text{border-radius:18px 6px 6px 18px}
.meta{font-size:11.5px;color:var(--faint);margin-top:3px}
.msg.owner .meta{text-align:right}
.msg.friday .meta a{color:var(--muted)}

/* cards */
.card{margin-top:8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.card-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--text)}
.card-icon svg{width:16px;height:16px}
.card-title{font-weight:600;font-size:14px;flex:1;min-width:0}
.card-sub{font-size:12.5px;color:var(--muted)}
.card-main{padding:10px 14px 14px}
.card-main p{margin:0 0 10px}
.status{font-size:12px;font-weight:550;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.status.pending{background:var(--warn-soft);color:var(--warn)}
.status.good{background:var(--ok-soft);color:var(--ok)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.account{display:inline-block;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:6px;padding:0 6px;color:var(--muted)}
.url{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere;margin:-4px 0 10px}
.action{font-weight:560;margin:0 0 6px}
.shot{display:block;width:100%;max-height:260px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:10px;margin:2px 0 12px;cursor:zoom-in;background:var(--softer)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.countdown{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{height:38px;padding:0 16px;border-radius:11px;border:1px solid var(--line-strong);background:#fff;font-weight:550;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{background:var(--softer);text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn:disabled{opacity:.45;cursor:default}
.code{flex:1;min-width:140px;height:42px;border:1px solid var(--line-strong);border-radius:11px;padding:0 14px;font:600 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;outline:none;background:#fff}
.code:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(24,24,27,.08)}
.err{color:var(--bad);font-size:13px;margin-top:8px}

/* typing */
.typing,.dots{display:inline-flex;gap:4px;align-items:center}
.typing{padding:10px 0}
.typing i,.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite ease-in-out both}
.dots{margin-left:6px}.dots i{width:4px;height:4px}
.typing i:nth-child(2),.dots i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3),.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:none}}

/* empty */
.empty{text-align:center;color:var(--muted);padding:12vh 16px 0;max-width:420px;margin:0 auto}
.empty .mark{width:48px;height:48px;border-radius:15px;font-size:22px;margin:0 auto 16px}
.empty h2{color:var(--text);font-size:18px;font-weight:620;margin:0 0 6px;letter-spacing:-.01em}
.empty p{margin:0}

/* composer */
footer{background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 28%);padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
.composer{max-width:728px;margin:0 auto;border:1px solid var(--line-strong);border-radius:20px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 16px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:#c4c4cc;box-shadow:0 0 0 4px rgba(24,24,27,.05),var(--shadow)}
.composer textarea{flex:1;border:0;outline:none;resize:none;background:transparent;padding:8px 0;max-height:160px;line-height:1.45}
.composer textarea::placeholder{color:var(--faint)}
.send{width:36px;height:36px;border-radius:12px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:opacity .15s}
.send:disabled{opacity:.2;cursor:default}
.send svg{width:18px;height:18px}
.hints{max-width:728px;margin:8px auto 0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hint{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.hint:hover{color:var(--text);border-color:var(--line-strong)}

/* lightbox, toast */
#lightbox{position:fixed;inset:0;background:rgba(255,255,255,.94);display:none;place-items:center;z-index:20;cursor:zoom-out;padding:24px}
#lightbox.open{display:grid}
#lightbox img{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:520px){.head{padding:8px 12px}#thread{padding:14px 12px 8px}footer{padding-left:10px;padding-right:10px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="mark">f</div>
    <div class="who"><b>friday</b><span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span></div>
    <button class="icon-btn" id="bell" title="Desktop notifications" aria-label="Desktop notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
    <a class="icon-btn" href="/portal" title="Open the portal"><span class="hide-sm">Portal</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    </a>
    <div class="menu">
      <button class="icon-btn" id="more" aria-label="More" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
      <div class="menu-list" id="menu">
        <a href="/portal#approvals">Approvals</a>
        <a href="/portal#runs">Runs</a>
        <button class="danger" id="clear">Clear conversation</button>
        <form method="post" action="/logout" style="margin:0"><button type="submit">Log out</button></form>
      </div>
    </div>
  </div>
</header>

<div id="scroller"><div id="thread" aria-live="polite"></div></div>

<footer>
  <form class="composer" id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Ask friday anything…" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
    </button>
  </form>
  <div class="hints"><button class="hint" data-say="Fetch last month's statements for all my accounts">Last month's statements</button><button class="hint" data-say="What's waiting on me?">What's waiting?</button><button class="hint" data-say="What can you do?">What can you do?</button></div>
</footer>

<div id="lightbox"><img alt="Page at the moment of the request"></div>
<div id="toast" role="status"></div>
<script src="/static/chat.js"></script>
</body>
</html>
